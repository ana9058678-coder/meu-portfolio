
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Painel Administrativo | Ana Flávia</title>

  <link rel="stylesheet" href="style.css">

  <style>
    .painel {
      max-width: 900px;
      margin: 50px auto;
      padding: 25px;
    }

    .painel h1 {
      color: #7041a6;
      margin-bottom: 10px;
    }

    .form-projeto {
      background: #fff;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 4px 20px #00000012;
      margin-top: 25px;
    }

    .form-projeto label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    .form-projeto input,
    .form-projeto textarea {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font: inherit;
      box-sizing: border-box;
    }

    .form-projeto textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-projeto button {
      margin-top: 20px;
      padding: 13px 22px;
      border: none;
      border-radius: 8px;
      background: #7041a6;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    .mensagem-painel {
      margin-top: 15px;
    }

    .lista-painel {
      margin-top: 35px;
    }

    .projeto-admin {
      background: white;
      padding: 18px;
      margin-top: 15px;
      border-radius: 12px;
      box-shadow: 0 3px 12px #00000010;
    }

    .botao-sair {
      float: right;
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #7041a6;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header class="cabecalho">
    <a href="index.html" class="logo">AF.</a>

    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="quemsoueu.html">Quem sou eu</a>
      <a href="portfolio.html">Portfólio</a>
    </nav>
  </header>

  <main class="painel">

    <button type="button" id="botaoSair" class="botao-sair">
      Sair
    </button>

    <h1>Painel Administrativo</h1>

    <p>Olá! Aqui você pode gerenciar os projetos do seu portfólio.</p>

    <section class="form-projeto">

      <h2>Cadastrar novo projeto</h2>

      <form id="formProjeto">

        <label for="nomeProjeto">Nome do projeto</label>
        <input
          type="text"
          id="nomeProjeto"
          required
          placeholder="Digite o nome do projeto"
        >

        <label for="descricaoProjeto">Descrição</label>
        <textarea
          id="descricaoProjeto"
          required
          placeholder="Conte um pouco sobre o projeto"
        ></textarea>

        <label for="linkProjeto">Link do projeto</label>
        <input
          type="url"
          id="linkProjeto"
          placeholder="https://..."
        >

        <label for="fotoProjeto">Imagem do projeto</label>
        <input
          type="file"
          id="fotoProjeto"
          accept="image/png,image/jpeg,image/webp"
        >

        <button type="submit" id="botaoCadastrar">
          Cadastrar projeto
        </button>

        <p id="mensagemPainel" class="mensagem-painel"></p>

      </form>

    </section>

    <section class="lista-painel">
      <h2>Meus projetos cadastrados</h2>

      <div id="listaProjetos">
        Carregando projetos...
      </div>
    </section>

  </main>

  <footer class="rodape">
    <p>© 2026 Ana Flávia. Todos os direitos reservados.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
<script src="dashboard.js"></script>

</body>
</html>
