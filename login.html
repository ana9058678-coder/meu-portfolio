
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Área de acesso administrativo do portfólio de Ana Flávia.">
  <meta name="robots" content="noindex, nofollow">
  <title>Entrar | Ana Flávia</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #090909;
    }

    .login-area {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 65px 7%;
      background:
        radial-gradient(circle at 15% 20%, #381017 0, transparent 35%),
        radial-gradient(circle at 85% 80%, #250b10 0, transparent 35%),
        #090909;
    }

    .login-card {
      width: 100%;
      max-width: 450px;
      padding: 45px;
      background: linear-gradient(145deg, #1b1919, #100e0f);
      border: 1px solid #51212b;
      border-radius: 22px;
      box-shadow: 0 20px 60px #00000080;
    }

    .login-logo {
      width: 90px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 25px;
    }

    .login-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .login-card h1 {
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      color: #ffffff;
      font-size: 34px;
      margin: 15px 0 8px;
    }

    .login-subtitulo {
      text-align: center;
      color: #bdb5b6;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .login-card .destaque {
      color: #ed3049;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
    }

    .campo-login {
      margin-bottom: 22px;
    }

    .campo-login label {
      display: block;
      font-weight: 600;
      font-size: 13px;
      color: #f0e9ea;
      margin-bottom: 9px;
    }

    .campo-login input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid #443337;
      border-radius: 10px;
      outline: none;
      font-family: inherit;
      font-size: 14px;
      color: #ffffff;
      background: #0b0b0b;
      transition: 0.3s;
      box-sizing: border-box;
    }

    .campo-login input::placeholder {
      color: #817779;
    }

    .campo-login input:focus {
      border-color: #d71932;
      box-shadow: 0 0 0 3px #d7193220;
    }

    .botao-login {
      width: 100%;
      padding: 16px;
      border: 1px solid #d71932;
      border-radius: 10px;
      background: #a30f25;
      color: white;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.3s;
    }

    .botao-login:hover {
      background: #d71932;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px #d7193240;
    }

    .botao-login:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .mensagem-login {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 10px;
      font-size: 13px;
      text-align: center;
      line-height: 1.5;
    }

    .mensagem-login.erro {
      display: block;
      background: #3b151b;
      color: #ff9aa7;
      border: 1px solid #702431;
    }

    .mensagem-login.sucesso {
      display: block;
      background: #142b1b;
      color: #8ee0a5;
      border: 1px solid #28643a;
    }

    .login-voltar {
      display: block;
      text-align: center;
      margin-top: 28px;
      color: #e04458;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }

    .login-voltar:hover {
      color: #ffffff;
    }

    @media (max-width: 500px) {
      .login-area {
        padding: 35px 18px;
      }

      .login-card {
        padding: 32px 23px;
      }

      .login-card h1 {
        font-size: 29px;
      }
    }
  </style>
</head>

<body>

  <header class="cabecalho">
    <a href="index.html" class="logo">
      <img src="imagens/logo-af.png" alt="Logo AF"
        style="width: 75px; height: 75px; object-fit: contain; vertical-align: middle;">
    </a>

    <nav class="menu">
      <a href="index.html">Início</a>
      <a href="quemsoueu.html">Quem sou eu</a>
      <a href="portfolio.html">Portfólio</a>
      <a href="contato.html">Contato</a>

      <a href="login.html"
         class="link-login"
         aria-label="Entrar na área administrativa"
         title="Entrar">

        <svg xmlns="http://www.w3.org/2000/svg"
          width="21" height="21" viewBox="0 0 24 24"
          fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round"
          stroke-linejoin="round" aria-hidden="true">

          <rect x="4" y="10" width="16" height="11" rx="2"/>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
          <path d="M12 14v3"/>

        </svg>
      </a>
    </nav>
  </header>

  <main class="login-area">

    <section class="login-card">

      <div class="login-logo">
        <img src="imagens/logo-af.png" alt="Logo AF">
      </div>

      <span class="destaque" style="display:block;text-align:center;">
        ÁREA RESTRITA
      </span>

      <h1>Bem-vindo(a)!</h1>

      <p class="login-subtitulo">
        Entre com seus dados para acessar o painel administrativo.
      </p>

      <form id="formLogin">

        <div class="campo-login">
          <label for="email">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Digite seu e-mail"
            autocomplete="username"
            required
          >
        </div>

        <div class="campo-login">
          <label for="senha">Senha</label>
          <input
            type="password"
            id="senha"
            name="senha"
            placeholder="Digite sua senha"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="botao-login" id="botaoEntrar">
          Entrar no painel
        </button>

        <div
          id="mensagemLogin"
          class="mensagem-login"
          role="status"
          aria-live="polite">
        </div>

      </form>

      <a href="index.html" class="login-voltar">
        ← Voltar para a página inicial
      </a>

    </section>

  </main>

  <footer class="rodape">
    <div>
      <a href="index.html" class="logo">
        <img src="imagens/logo-af.png" alt="Logo AF"
          style="width: 75px; height: 75px; object-fit: contain; vertical-align: middle;">
      </a>
      <p>Construindo meu caminho na tecnologia.</p>
    </div>

    <p class="copyright">
      © 2026 Ana Flávia. Todos os direitos reservados.
    </p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>
  <script src="login.js"></script>

</body>
</html>
