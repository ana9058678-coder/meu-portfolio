
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="script.js"></script>

  <script>
    const supabaseClient = window.supabaseClient;
    const listaProjetos = document.getElementById('listaProjetos');

    function escaparHTML(valor) {
      return String(valor ?? '').replace(/[&<>"']/g, caractere => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
      })[caractere]);
    }

    function obterImagem(foto) {
      if (!foto) return '';

      if (/^https?:\/\//i.test(foto)) {
        try {
          const url = new URL(foto);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch {
          return '';
        }
      }

      return supabaseClient.storage
        .from('portfolio-imagens')
        .getPublicUrl(foto).data.publicUrl;
    }

    function criarCartao(projeto) {
      const cartao = document.createElement('article');
      cartao.className = 'projeto-card';

      const areaImagem = document.createElement('div');
      areaImagem.className = 'projeto-imagem';

      const imagem = obterImagem(projeto.foto);

      if (imagem) {
        const img = document.createElement('img');
        img.src = imagem;
        img.alt = 'Imagem do projeto ' + (projeto.nome || '');
        img.loading = 'lazy';
        img.onerror = () => {
          areaImagem.innerHTML = '<span class="sem-foto">AF.</span>';
        };
        areaImagem.appendChild(img);
      } else {
        areaImagem.innerHTML = '<span class="sem-foto">AF.</span>';
      }

      const conteudo = document.createElement('div');
      conteudo.className = 'projeto-conteudo';

      const categoria = document.createElement('span');
      categoria.className = 'categoria';
      categoria.textContent = 'PROJETO';

      const titulo = document.createElement('h3');
      titulo.textContent = projeto.nome || '';

      const descricao = document.createElement('p');
      descricao.textContent = projeto.descricao || '';

      conteudo.append(categoria, titulo, descricao);

      let endereco = '';

      try {
        const url = new URL(projeto.link || '');
        if (['http:', 'https:'].includes(url.protocol)) {
          endereco = url.href;
        }
      } catch {}

      if (endereco) {
        const link = document.createElement('a');
        link.className = 'projeto-link';
        link.href = endereco;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = 'Ver projeto →';
        conteudo.appendChild(link);
      } else {
        const aviso = document.createElement('span');
        aviso.className = 'projeto-link';
        aviso.textContent = 'Link não informado';
        conteudo.appendChild(aviso);
      }

      cartao.append(areaImagem, conteudo);
      return cartao;
    }

    async function carregarProjetos() {
      listaProjetos.innerHTML = `
        <div class="estado-projetos">
          <h3>Carregando projetos...</h3>
          <p>Aguarde um instante.</p>
        </div>
      `;

      const { data, error } = await supabaseClient
        .from('projetos')
        .select('id, nome, descricao, link, foto, created_at')
        .order('created_at', { ascending: false });

      if (error) {
        console.error('Erro ao carregar projetos:', error);
        listaProjetos.innerHTML = `
          <div class="estado-projetos">
            <h3>Não foi possível carregar os projetos.</h3>
            <p>Verifique a conexão e as permissões de leitura.</p>
          </div>
        `;
        return;
      }

      if (!data || data.length === 0) {
        listaProjetos.innerHTML = `
          <div class="estado-projetos">
            <h3>Seus projetos aparecerão aqui!</h3>
            <p>Cadastre um projeto no painel administrativo.</p>
          </div>
        `;
        return;
      }

      listaProjetos.replaceChildren();

      data.forEach(projeto => {
        listaProjetos.appendChild(criarCartao(projeto));
      });
    }

    carregarProjetos();
  </script>
</body>
</html>
